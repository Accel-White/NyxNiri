# ── NyxNiri 星环启动器 (Star-Ring Radial Menu) 自定义配置 ─────────────────────
# 配置文件位置: ~/.config/niri/scratchpad-items__custom__.toml
# (含 __custom__ 标识，更新部署时会被 Dunder Protocol 自动识别并保留个人配置)
#
# 支持属性说明:
# - name       : 主标题文本
# - desc       : 副标题/描述文本 (可选，留空会自动生成)
# - icon       : Nerd Font 图标符号 (如 󰞷, 󰓅, 󰉋, 󰊤, 󰖟, 󰘳)
# - cmd        : 本地应用启动命令或脚本路径 (与 url 互斥)
# - url        : 网页链接 (例如 "https://github.com"，自动通过默认浏览器打开)
# - shortcut   : 显示在右上角的数字或字母角标 (如 "1", "2", "3", "4")
# - mnemonics  : 字母助记列表 (如 ["g", "h"]，按键直接瞬时触发)
# - color_key  : 动态主题色 (统一 "secondary"，也可根据喜好使用 "primary", "tertiary" 等)
# - children   : 嵌套子菜单数组 (声明后自动识别为文件夹，支持无限层级下钻)

# ── 1. 终端应用 (Terminal) ───────────────────────────────────────────────────
[[items]]
name = "Kitty"
desc = "Tmux Terminal"
icon = "󰞷"
cmd = "kitty"
shortcut = "1"
mnemonics = ["t", "k"]
color_key = "secondary"

# ── 2. 系统工具箱 (System Tools Folder) ─────────────────────────────────────────
[[items]]
name = "System Tools"
desc = "Folder · 3 Tools"
icon = "󰘳"
shortcut = "2"
mnemonics = ["s", "t"]
color_key = "secondary"

  [[items.children]]
  name = "Mission Center"
  desc = "System Monitor"
  icon = "󰓅"
  cmd = "missioncenter"
  shortcut = "1"
  mnemonics = ["m"]
  color_key = "secondary"

  [[items.children]]
  name = "Eye Care"
  desc = "Toggle Warmth"
  icon = "󰛨"
  cmd = "~/.config/niri/scripts/toggle-eyecare.sh"
  shortcut = "2"
  mnemonics = ["e"]
  color_key = "secondary"

  [[items.children]]
  name = "Clean Cache"
  desc = "Free Disk Space"
  icon = "󰃢"
  cmd = "~/.config/fish/clean-cache"
  shortcut = "3"
  mnemonics = ["c"]
  color_key = "secondary"

# ── 3. 常用网站 (Websites Folder) ──────────────────────────────────────────────
[[items]]
name = "Websites"
desc = "Folder · 3 Sites"
icon = "󰖟"
shortcut = "3"
mnemonics = ["w"]
color_key = "secondary"

  [[items.children]]
  name = "Zhihu"
  desc = "知乎 · 发现更大世界"
  icon = "󰖟"
  url = "https://www.zhihu.com"
  shortcut = "1"
  mnemonics = ["z"]
  color_key = "secondary"

  [[items.children]]
  name = "Bilibili"
  desc = "哔哩哔哩 (゜-゜)つロ"
  icon = "󰕧"
  url = "https://www.bilibili.com"
  shortcut = "2"
  mnemonics = ["b"]
  color_key = "secondary"

  [[items.children]]
  name = "GitHub"
  desc = "Code Repository"
  icon = "󰊤"
  url = "https://github.com"
  shortcut = "3"
  mnemonics = ["g"]
  color_key = "secondary"

# ── 4. 文件管理器 (File Manager) ──────────────────────────────────────────────
[[items]]
name = "Nautilus"
desc = "File Manager"
icon = "󰉋"
cmd = "nautilus"
shortcut = "4"
mnemonics = ["n", "f"]
color_key = "secondary"
